<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PalantirAtHome</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>PalantirAtHome</strong>
            <small>Investigation OS</small>
          </div>
        </div>
        <section class="media-panel" aria-label="Геоданные файла">
          <label class="upload-drop" id="mediaDrop">
            <input id="mediaFile" type="file" accept="image/*,video/*" multiple />
            <strong>Загрузить фото или видео</strong>
            <small>Координаты читаются из метаданных. Сам файл не сохраняется — остаётся превью.</small>
          </label>
          <p id="mediaStatus" class="media-status"></p>
          <div id="mediaList" class="media-list"></div>
        </section>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <h1 id="page-title">Глобус</h1>
          <span id="api-status" class="status">API…</span>
        </header>
        <div class="workspace-body">
          <div id="globeRoot" class="globe-root look-crt">
            <div id="cesiumContainer" class="globe-canvas"></div>
            <div class="look-fx" aria-hidden="true">
              <div class="look-scanlines"></div>
              <div class="look-vignette"></div>
              <div class="look-grain"></div>
            </div>
            <div id="globeHud" class="globe-hud">Загрузка глобуса…</div>
          </div>
          <main id="app" class="content is-hidden"></main>
        </div>
      </div>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
