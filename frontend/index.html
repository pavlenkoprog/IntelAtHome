<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PalantirAtHome</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>PalantirAtHome</strong>
            <small>Investigation OS</small>
          </div>
        </div>
        <nav class="nav">
          <a href="#/globe" data-route="globe">Глобус</a>
          <a href="#/dashboard" data-route="dashboard">Обзор</a>
          <a href="#/investigations" data-route="investigations">Расследования</a>
          <a href="#/entities" data-route="entities">Сущности</a>
          <a href="#/datasets" data-route="datasets">Датасеты</a>
        </nav>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <h1 id="page-title">Глобус</h1>
          <span id="api-status" class="status">API…</span>
        </header>
        <div class="workspace-body">
          <div id="globeRoot" class="globe-root look-normal">
            <div id="cesiumContainer" class="globe-canvas"></div>
            <div class="look-fx" aria-hidden="true">
              <div class="look-scanlines"></div>
              <div class="look-vignette"></div>
              <div class="look-grain"></div>
            </div>
            <div id="globeHud" class="globe-hud">Загрузка глобуса…</div>
          </div>
          <main id="app" class="content is-hidden"></main>
        </div>
      </div>
    </div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
